<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-J4PvcXm2ZerC3DGisVTWSs6x1HjzjXwq4a6spH9jWNk='; style-src 'sha256-Oj1jeZSRiAX7/S2E5/vrh+lD0iCTIDb/ZCIS7CUkmK0='; img-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'"><title>RIFT ANALYTICS JP | 詳細</title><style>*{box-sizing:border-box}body{margin:0;background:#0b101b;color:#e5edf8;font:15px system-ui,sans-serif}main{max-width:900px;margin:auto;padding:18px}h1{font-size:26px;margin:12px 0}a{color:#8cc8ff}small,p{color:#a9b7cb}button,select,input{font:inherit;background:#19263a;color:#fff;border:1px solid #40516b;border-radius:8px;padding:10px}button[aria-pressed=true]{background:#275c83}nav,.controls{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}section{background:#131d2c;border:1px solid #29384d;border-radius:12px;padding:14px;margin:12px 0}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px 5px;border-bottom:1px solid #29384d}td:nth-child(n+2),th:nth-child(n+2){text-align:right;white-space:nowrap}.good{color:#78dfb2}.bad{color:#ff9b9b}label{display:grid;gap:5px}input[type=file]{max-width:100%}img{width:36px;height:36px;border-radius:6px;vertical-align:middle;margin-right:8px}</style></head><body><main><a href="./index.html">← Tierランキング</a><h1><span id="portrait"></span><span id="title">チャンピオン詳細</span></h1><p id="status">プレビュー：詳細JSONを選択してください。</p><section><label>詳細JSON<input id="detailFile" type="file" accept=".json,application/json"></label><label>名称カタログ（任意）<input id="catalogFile" type="file" accept=".json,application/json"></label><small>選択したファイルはブラウザ内で読み込み、外部送信しません。</small></section><nav id="tabs"></nav><div class="controls"><label>ランク<select id="rank"></select></label><label>レーン<select id="lane"></select></label><label>並び順<select id="sort"><option value="win_rate_percent">勝率 高い順</option><option value="low">勝率 低い順</option><option value="appear_rate_percent">使用・出現率順</option></select></label></div><section><p id="date"></p><table><thead><tr><th>構成・相手</th><th>勝率</th><th id="usage">使用率</th></tr></thead><tbody id="rows"></tbody></table><p id="empty">詳細データ待ち</p></section><small>出典：Tencent 中国版統計。試合数は未確認。高勝率は因果的な有利を保証しません。ランク区分の名称は確認後に対応します。</small></main><script>const $=x=>document.getElementById(x);let detail=null,catalog={},heroes={},tab=0;const specs=[['ビルド','hero_equip_core','core_equip','equip_id','equip'],['ルーン','hero_equip_rune','rune','rune_ids','rune'],['ブーツ','hero_equip_shoe','shoe','shoe_id','equip'],['スペル','hero_equip_skill','skill','skill_ids','skill'],['対面相性','hero_counter_point','counter_point','hero_id','hero'],['シナジー','hero_best_partner','partner_list','hero_id','hero']];const lanes={'2':'バロン','5':'ジャングル','1':'ミッド','3':'ADC','4':'サポート'};function el(t,s){const e=document.createElement(t);e.textContent=s;return e}function options(e,vals,labels){const old=e.value;e.replaceChildren(...vals.map(v=>{const o=el('option',labels[v]||v);o.value=v;return o}));if(vals.includes(old))e.value=old}function valid(d){return d&&/^\d{1,10}$/.test(String(d.hero_id))&&d.data&&typeof d.data==='object'}function setDetail(d){if(!valid(d))throw Error('詳細JSONの形式が違います');detail=d;render()}function render(){if(!detail)return;const id=String(detail.hero_id);$('title').textContent=heroes[id]||'チャンピオン ID '+id;$('portrait').replaceChildren();const im=document.createElement('img');im.src='./icons/'+id+'.png';im.alt='';im.onerror=()=>im.remove();$('portrait').append(im);$('status').textContent='中国サーバー / 取得日時 '+(detail.fetched_at||'不明');const [label,key,field,idkey,kind]=specs[tab];const raw=detail.data[key];const partner=tab===5;const groups=tab===4?raw:raw?.classic;const gs=Array.isArray(groups)?groups:[];const ranks=[...new Set(gs.map(x=>String(x.rank_level)))].sort();options($('rank'),ranks,Object.fromEntries(ranks.map(x=>[x,'ランク区分 '+x])));const group=gs.find(x=>String(x.rank_level)===$('rank').value);const positions=Object.keys(group?.[field]||{});options($('lane'),positions,lanes);$('rank').disabled=partner;$('lane').disabled=partner;let rows=partner?raw?.partner_list:group?.[field]?.[$('lane').value];rows=Array.isArray(rows)?rows.slice():[];const date=partner?raw?.dtstatdate:group?.dtstatdate;$('date').textContent='統計日：'+(date||'不明')+(partner?' / レーン・ランク別の区分なし':'');const metric=$('sort').value;const num=(r,k)=>r[k]!=null&&r[k]!==''&&Number.isFinite(Number(r[k]))?Number(r[k]):null;rows.sort((a,b)=>{if(metric==='low')return 0;const x=num(a,metric),y=num(b,metric);return x===null?1:y===null?-1:metric==='low'?0:y-x});if(metric==='low')rows.sort((a,b)=>(num(a,'win_rate_percent')??Infinity)-(num(b,'win_rate_percent')??Infinity));$('rows').replaceChildren();for(const r of rows){const tr=el('tr','');const name=String(r[idkey]??'').split(',').map(i=>kind==='hero'?(heroes[i]||'ID '+i):(catalog[kind]?.[i]?.name_ja||catalog[kind]?.[i]?.name_zh||'ID '+i)).join(' / ');tr.append(el('td',name));for(const k of ['win_rate_percent','appear_rate_percent']){const n=num(r,k),td=el('td',n===null?'不明':n.toFixed(2)+'%');if(k==='win_rate_percent'&&n!==null)td.className=n>=50?'good':'bad';tr.append(td)}$('rows').append(tr)}$('empty').textContent=rows.length?'掲載 '+rows.length+' 件':'データなし';$('usage').textContent=tab>=4?'出現率':'使用率';}specs.forEach((s,i)=>{const b=el('button',s[0]);b.setAttribute('aria-pressed',i===0);b.onclick=()=>{tab=i;for(const [j,x] of [...$('tabs').children].entries())x.setAttribute('aria-pressed',j===i);render()};$('tabs').append(b)});for(const id of ['rank','lane','sort'])$(id).onchange=render;async function readFile(e){const f=e.target.files[0];if(!f||f.size>15000000)throw Error('ファイルなし、またはサイズ超過');return JSON.parse(await f.text())} $('detailFile').onchange=async e=>{try{setDetail(await readFile(e))}catch(x){$('status').textContent=x.message}};$('catalogFile').onchange=async e=>{try{catalog=await readFile(e);render()}catch(x){$('status').textContent=x.message}};async function get(p){const r=await fetch(p);if(!r.ok)throw Error('未配置');return r.json()} async function init(){try{const d=await get('./data.json');for(const rows of Object.values(d.lanes||{}))if(Array.isArray(rows))for(const r of rows)if(/^\d{1,10}$/.test(String(r.id))&&typeof r.name==='string')heroes[r.id]=r.name}catch{}try{catalog=await get('./assets/catalog.json')}catch{}const id=new URLSearchParams(location.search).get('id');if(id&&/^\d{1,10}$/.test(id)){try{setDetail(await get('./details/'+id+'.json'))}catch{$('status').textContent='詳細データ未公開。テストJSONを選択してください。'}}}init();</script></body></html>

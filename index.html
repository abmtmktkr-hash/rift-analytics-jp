<!doctype html><html lang="ja"><head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-JwhYz+EA5hrSbJjffBt+TYmglHXcvO1Sp8NPu65dLBg='; style-src 'sha256-75LRdL+aQbytq/IGaoQ8QtfioVPtQSKY1KV7Mc114Ak='; connect-src 'self' https://ddragon.leagueoflegends.com; img-src https://ddragon.leagueoflegends.com; base-uri 'none'; form-action 'none'; object-src 'none'"><meta name="referrer" content="no-referrer"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>RIFT ANALYTICS JP</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#e7edf7;font:15px system-ui,sans-serif}main{max-width:960px;margin:auto;padding:20px 10px}h1{color:#e8c780;font-size:clamp(24px,5vw,40px)}p,small{color:#aabbd0}nav{display:flex;flex-wrap:wrap;gap:6px;margin:20px 0}button,select{background:#18263a;color:white;border:1px solid #41536c;border-radius:8px;padding:10px}button.active{background:#e8c780;color:#111827}section{background:#111d2e;border:1px solid #293b53;border-radius:12px;padding:10px}.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;white-space:nowrap}th,td{padding:12px 6px;text-align:right;border-bottom:1px solid #293b53}th:nth-child(2),td:nth-child(2){text-align:left}th{color:#9cb0c9;font-size:12px}td:nth-child(3){color:#e8c780;font-weight:bold}footer{font-size:12px}#status{color:#ffd38a}@media(max-width:500px){th,td{padding:10px 4px;font-size:12px}th{font-size:10px}td:nth-child(2){white-space:normal;min-width:75px}}.champ{display:flex;align-items:center;gap:6px}.champ img{width:32px;height:32px;border-radius:5px;object-fit:cover;flex-shrink:0}</style></head><body><main><header><small>WILD RIFT / 日本語統計</small><h1>RIFT ANALYTICS JP</h1><p>全5レーン・ランキング TOP10</p><div id="status">統計を読み込み中…</div></header><nav id="tabs"></nav><section><label>並び順 <select id="sort"><option value="score">総合評価</option><option value="wr">勝率</option><option value="pr">使用率</option><option value="br">BAN率</option></select></label><h2 id="heading"></h2><div class="scroll"><table><thead><tr><th>順位</th><th>チャンピオン</th><th>Tier</th><th>勝率</th><th>使用率</th><th>BAN率</th><th>前回比</th></tr></thead><tbody id="rows"></tbody></table></div></section><footer><p id="source"></p><p>総合評価：レーン内パーセンタイル（勝率60%、使用率25%、BAN率15%）。Tierは総合評価に基づきます。前回比は総合順位の変動です。公式Tierではありません。</p><p>アイコン：Riot Games Data Dragon（PC版の素材。未対応キャラクターは名前のみ表示）。非公式ファンサイト。Riot Gamesとは無関係です。</p></footer></main><script>
const roles=[['top','バロン'],['jungle','ジャングル'],['mid','ミッド'],['ad','ADC'],['support','サポート']];const $=id=>document.getElementById(id);let lane='top',data=null;const icons=new Map();function render(){const label=roles.find(x=>x[0]===lane)[1];$('heading').textContent=label+' TOP10';$('tabs').replaceChildren(...roles.map(([key,name])=>{const b=document.createElement('button');b.textContent=name;b.className=key===lane?'active':'';b.onclick=()=>{lane=key;render()};return b}));if(!data)return;const k=$('sort').value;const a=[...data.lanes[lane]].sort((a,b)=>b[k]-a[k]||a.rank-b.rank).slice(0,10);$('rows').replaceChildren(...a.map((r,i)=>{const tr=document.createElement('tr');const delta=r.delta==null?'—':r.delta>0?'↑'+r.delta:r.delta<0?'↓'+Math.abs(r.delta):'→';for(const v of [i+1,r.name,r.tier,...['wr','pr','br'].map(f=>Number(r[f]).toFixed(2)+'%'),delta]){const td=document.createElement('td');td.textContent=v;if(tr.children.length===1&&icons.has(r.name)){const wrap=document.createElement('span');wrap.className='champ';const img=document.createElement('img');img.src=icons.get(r.name);img.alt='';img.loading='lazy';img.onerror=()=>img.remove();wrap.append(img,document.createTextNode(r.name));td.replaceChildren(wrap)}tr.append(td)}return tr}));} $('sort').onchange=render;render();fetch('./data.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(d=>{if(!roles.every(([k])=>Array.isArray(d.lanes?.[k])&&d.lanes[k].length>=10&&d.lanes[k].length<=250&&d.lanes[k].every(r=>r&&typeof r.name==='string'&&r.name.length<=100&&['wr','pr','br','score'].every(f=>Number.isFinite(r[f])&&r[f]>=0&&r[f]<=100)&&Number.isInteger(r.rank)&&r.rank>0&&['S+','S','A','B','C'].includes(r.tier))))throw Error('統計形式が不正です');data=d;$('status').textContent='統計基準日：'+d.date+' ｜ 更新：'+new Date(d.updated).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo'})+' JST';$('source').textContent='出典：'+(d.source||'Tencent China ranked stats');render()}).catch(e=>{$('status').textContent='統計の読み込みに失敗：'+e.message;});

(async()=>{try{const base='https://ddragon.leagueoflegends.com/';const v=(await (await fetch(base+'api/versions.json')).json())[0];if(!/^\d+\.\d+\.\d+$/.test(v))return;const d=await (await fetch(base+'cdn/'+v+'/data/ja_JP/champion.json')).json();for(const c of Object.values(d.data)){if(typeof c.name==='string'&&/^[A-Za-z0-9_]+\.png$/.test(c.image?.full))icons.set(c.name,base+'cdn/'+v+'/img/champion/'+c.image.full)}render()}catch(e){console.warn('Icon data unavailable')}})();
</script></body></html>

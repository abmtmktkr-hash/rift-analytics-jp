name: Test detail collector
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Collect three champions
        run: python3 details.py --limit 3
      - name: Save private-to-run test output
        uses: actions/upload-artifact@v4
        with:
          name: detail-test
          path: details/*.json
          retention-days: 1

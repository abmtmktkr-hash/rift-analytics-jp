name: Test champion detail APIs
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Test public endpoints
        run: |
          python3 - <<'PY'
          import json, time, urllib.request
          heroes = [10001, 10002, 10136]
          endpoints = [
              'hero_counter_point',
              'hero_best_partner',
              'hero_equip_core',
              'hero_equip_shoe',
              'hero_equip_rune',
              'hero_equip_skill'
          ]
          passed = 0
          total = len(heroes) * len(endpoints)
          for hero in heroes:
              for endpoint in endpoints:
                  url = 'https://mlol.qt.qq.com/go/lgame_battle_info/' + endpoint + '?hero_id=' + str(hero)
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent': 'RiftAnalyticsJP-API-Test/1.0', 'Accept': 'application/json'})
                      with urllib.request.urlopen(req, timeout=20) as response:
                          raw = response.read(2000001)
                          if len(raw) > 2000000:
                              raise ValueError('Response too large')
                          obj = json.loads(raw)
                          data = obj.get('data')
                          expected = list if endpoint == 'hero_counter_point' else dict
                          if obj.get('result') != 0 or not isinstance(data, expected) or not data:
                              raise ValueError('Unexpected API data')
                          if endpoint.startswith('hero_equip_') and not data.get('classic'):
                              raise ValueError('Missing classic data')
                          if endpoint == 'hero_best_partner' and not data.get('partner_list'):
                              raise ValueError('Missing partner list')
                          passed += 1
                          print(f'PASS {hero} {endpoint}: {len(raw)} bytes', flush=True)
                  except Exception as exc:
                      print(f'FAIL {hero} {endpoint}: {exc}', flush=True)
                  time.sleep(3)
          print(f'Passed {passed}/{total}')
          raise SystemExit(passed != total)
          PY

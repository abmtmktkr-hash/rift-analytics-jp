name: Test asset catalog
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate catalog
        run: python3 assets.py --output assets-test/catalog.json
      - name: Check eligible icons without downloading
        run: python3 download_assets.py --catalog assets-test/catalog.json
      - name: Save test catalog
        uses: actions/upload-artifact@v4
        with:
          name: asset-catalog-test
          path: assets-test/catalog.json
          retention-days: 7

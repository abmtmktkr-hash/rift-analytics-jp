<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>RIFT ANALYTICS JP</title><style>body{background:#0b1220;color:#e7edf7;font:15px system-ui;margin:auto;max-width:960px;padding:20px}h1{color:#e8c780}button,select{background:#192b41;color:white;padding:10px;border:1px solid #52627a;border-radius:8px;margin:3px}button.active{background:#a17c36}table{border-collapse:collapse;width:100%;white-space:nowrap}td,th{padding:10px 5px;border-bottom:1px solid #33445a;text-align:right}td:nth-child(2),th:nth-child(2){text-align:left}section{overflow:auto}a{color:#9ecfff}small{color:#b5c5db}</style><h1>RIFT ANALYTICS JP</h1><p>中国サーバー・ダイヤモンド以上</p><p id="status">読み込み中</p><nav id="tabs"></nav><select id="sort"><option value="score">総合順</option><option value="wr">勝率順</option><option value="pr">使用率順</option><option value="br">BAN率順</option></select><section><table><thead><tr><th>総合順位</th><th>キャラ</th><th>Tier</th><th>勝率</th><th>使用率</th><th>BAN率</th><th>前回比</th></tr></thead><tbody id="rows"></tbody></table></section><p><small>総合点：レーン内相対順位を勝率60%、使用率25%、BAN率15%で評価。使用率1%未満は※。パッチ番号は取得元にないため表示しません。非公式ファンサイト。</small></p><a href="https://github.com/ry2x/WildRift-Merged-Stats-Data">統計出典</a> / <a href="https://github.com/ry2x/WildRift-Merged-Champion-Data">名称出典</a><script>const $=x=>document.getElementById(x), lanes={top:'バロン',jungle:'JG',mid:'MID',ad:'ADC',support:'SUP'};let key='top',data;function render(){for(let b of $('tabs').children)b.classList.toggle('active',b.dataset.key===key);let k=$('sort').value,a=[...data.lanes[key]].sort((x,y)=>y[k]-x[k]).slice(0,10);$('rows').replaceChildren(...a.map(r=>{let tr=document.createElement('tr');for(let v of [r.rank,r.name+(r.pr<1?' ※':''),r.tier,...['wr','pr','br'].map(f=>r[f].toFixed(2)+'%'),r.delta==null?'—':r.delta>0?'↑'+r.delta:r.delta<0?'↓'+(-r.delta):'—']){let td=document.createElement('td');td.textContent=v;tr.append(td)}return tr}))}for(let [k,n] of Object.entries(lanes)){let b=document.createElement('button');b.textContent=n;b.dataset.key=k;b.onclick=()=>{key=k;if(data)render()};$('tabs').append(b)}$('sort').onchange=()=>data&&render();fetch('https://raw.githubusercontent.com/abmtmktkr-hash/rift-analytics-jp/main/data.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{data=d;$('status').textContent='統計基準日 '+new Date(d.date).toLocaleDateString('ja-JP')+' / 更新 '+new Date(d.updated).toLocaleString('ja-JP')+(Date.now()-Date.parse(d.updated)>15*86400000?' / 更新遅延':'');render()}).catch(()=>$('status').textContent='統計未取得・初回更新待ち、または取得エラー');</script></html>
